[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pl_keyboard", "cli"]

[project]
name = "keyboard-lm-pl"
version = "0.0.1"
description = "Train a Polish next-word/swipe language model for FUTO Keyboard (GGUF)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# tqdm is the only always-on runtime dependency: the CLIs use it for progress
# bars. It is pure-Python and tiny, so it stays out of the heavy [train] extra.
dependencies = ["tqdm>=4"]

# Heavy ML deps live in an optional group: the pure `pl_keyboard` library and the
# whole test suite run without them (tests inject fakes at the heavy boundaries).
[project.optional-dependencies]
train = [
    "torch",
    "transformers>=4.49,<5",
    "datasets",
    "sentencepiece",
    "gguf",
    "numpy",
]
dev = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
    "hypothesis",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["pl_keyboard", "cli"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
